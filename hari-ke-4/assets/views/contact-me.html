<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hari-ke-4</title>

    <link rel="shortcut icon" href="../images/logo.gif" type="image/x-icon">

    <!--! Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body data-bs-theme="dark">

    <!--* Navbar start -->
    <nav class="navbar navbar-expand-md bg-body-tertiary py-1 shadow sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">
                <img src="../images/logo.gif" alt="logo" width="50" class="d-inline-block align-text-top" />
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="../../index.html"><b>Home</b></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="my-project.html"><b>My Project</b></a>
                    </li>
                </ul>

                <div class="d-flex">
                    <a href="#" class="btn btn-primary w-100 fw-bold">
                        Contact Me
                    </a>
                </div>

            </div>
        </div>
    </nav>
    <!--* Navbar end -->

    <div class="container mt-5 mb-5">

        <!--* Alert -->
        <div id="alertBox" class="alert d-none text-center" role="alert"></div>

        <!-- container form-->
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <h2 class="mb-4 text-center">Order a Website According to Your Needs</h2>

                <div class="p-4 border rounded shadow-sm bg-body-tertiary">

                    <!--* Form start -->
                    <form id="formNama" novalidate>

                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" placeholder="Fullname" name="nama" required />
                            <div class="invalid-feedback">Name is required.</div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required />
                            <div class="invalid-feedback">Enter a valid email using @</div>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" id="phone" placeholder="08123456789" required />
                            <div class="invalid-feedback">Phone number is required.</div>
                        </div>

                        <div class="mb-3">
                            <label for="subject" class="form-label">Website Design</label>
                            <select class="form-select" id="subject" required>
                                <option value="" selected disabled>Choose design</option>
                                <option value="Portofolio">Portofolio</option>
                                <option value="Inquiry">Ecommerce</option>
                                <option value="Support">Mobile App</option>
                                <option value="Other">Other</option>
                            </select>
                            <div class="invalid-feedback">Must select one design</div>
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Notes</label>
                            <textarea class="form-control" id="message" rows="4" required
                                placeholder="Describe what kind of website you want to order..."></textarea>
                            <div class="invalid-feedback">Notes cannt be empty.</div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <button type="submit" class="btn btn-primary px-4">Send</button>
                        </div>
                    </form>
                    <!--* Form end -->

                </div>
            </div>
        </div>
    </div>

    <!--! Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!--! Javascript -->
    <script src="../js/contactMeFormSubmit.js" type="module"></script>

</body>

</html>
