<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Hari Ke-4</title>

    <link rel="shortcut icon" href="../images/logo.gif" type="image/x-icon">

    <!--! Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body data-bs-theme="dark">

    <!-- navbar start -->
    <nav class="navbar navbar-expand-md bg-body-tertiary py-1 shadow sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">
                <img src="../images/logo.gif" alt="logo" width="50" class="d-inline-block align-text-top" />
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="../../index.html"><b>Home</b></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#"><b>My Project</b></a>
                    </li>
                </ul>

                <div class="d-flex">
                    <a href="contact-me.html" class="btn btn-primary w-100">
                        Contact Me
                    </a>
                </div>

            </div>
        </div>
    </nav>
    <!-- navbar end -->

    <div id="alertBox" class="alert d-none text-center" role="alert"></div>

    <div class="container mt-3 mb-2">

        <!-- FORM -->
        <h1 class="text-center py-3">ADD MY PROJECT</h1>

        <div class="row">
            <div class="col-md-6 offset-md-3">

                <div class="form-group pb-2">
                    <label for="projectName">Project Name</label>
                    <input type="text" class="form-control" id="projectName" required />
                    <div class="invalid-feedback">
                        Project name is required
                    </div>
                </div>

                <div class="form-group pb-2">
                    <label for="startDate">Start Date</label>
                    <input type="date" class="form-control" id="startDate" required />
                    <div class="invalid-feedback">
                        Start date is required
                    </div>
                </div>

                <div class="form-group pb-2">
                    <label for="endDate">End Date</label>
                    <input type="date" class="form-control" id="endDate" required />
                    <div class="invalid-feedback">
                        End date is required
                    </div>
                </div>

                <div class="form-group pb-2">
                    <label for="description">Description <i>(optional)</i></label>
                    <textarea class="form-control" id="description" rows="3"></textarea>
                    <div class="invalid-feedback">
                        Description is required
                    </div>
                </div>

                <div class="form-group pb-2">
                    <label>Technologies</label>
                    <div id="techGroup">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input tech-checkbox" type="checkbox"
                                value='<i class="fa-brands fa-vuejs" style="color: #63E6BE; font-size: 1.5rem;"></i>' />
                            <label class="form-check-label">Vue</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input tech-checkbox" type="checkbox" id="checkAngular"
                                value='<i class="fa-brands fa-angular" style="color: #e01600; font-size: 1.5rem;"></i>' />
                            <label class="form-check-label" for="checkAngular">Angular</label>
                        </div>
                        
                        <div class="form-check form-check-inline">
                            <input class="form-check-input tech-checkbox" type="checkbox" id="checkReact"
                                value='<i class="fa-brands fa-react" style="color: #74C0FC; font-size: 1.5rem;"></i>' />
                            <label class="form-check-label" for="checkReact">React</label>
                        </div>
                        
                        <div class="form-check form-check-inline">
                            <input class="form-check-input tech-checkbox" type="checkbox" id="checkJS"
                                value='<i class="fa-brands fa-js" style="color: #f9e777; font-size: 1.5rem;"></i>' />
                            <label class="form-check-label" for="checkJS">JavaScript</label>
                        </div>
                    </div>

                    <!-- feedback khusus checkbox group -->
                    <div class="invalid-feedback d-block" id="techFeedback">
                        Please select at least one technology
                    </div>
                </div>

                <div class="form-group pb-2">
                    <label for="uploadImage">Upload Image <i>(optional)</i></label>
                    <input type="file" class="form-control" id="uploadImage" accept="image/*" />
                    <div class="invalid-feedback">
                        Project image is required
                    </div>
                </div>

                <div class="text-end pb-4">
                    <button type="button" class="btn btn-info" id="submitBtn">Submit</button>
                </div>

            </div>
        </div>

        <!-- PROJECT LIST -->
        <h2 class="text-center mt-4">MY PROJECT</h2>
        <div class="row" id="root"></div>

    </div>

    <!--! Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!--! Javascript -->
    <script src="../js/myProjectFormSubmit.js" type="module"></script>
</body>

</html>
