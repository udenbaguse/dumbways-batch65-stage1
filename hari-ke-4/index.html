<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Hari Ke-4</title>

    <link rel="shortcut icon" href="assets/images/logo.gif" type="image/x-icon">



    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body data-bs-theme="dark">

    <div class="container">

        <!-- FORM -->
        <h1 class="text-center py-3">ADD MY PROJECT</h1>

        <div class="row">
            <div class="col-md-6 offset-md-3">

                <div class="form-group pb-2">
                    <label for="projectName">Project Name</label>
                    <input type="text" class="form-control" id="projectName">
                </div>

                <div class="form-group pb-2">
                    <label for="startDate">Start Date</label>
                    <input type="date" class="form-control" id="startDate">
                </div>

                <div class="form-group pb-2">
                    <label for="endDate">End Date</label>
                    <input type="date" class="form-control" id="endDate">
                </div>

                <div class="form-group pb-2">
                    <label for="description">Description</label>
                    <textarea class="form-control" id="description" rows="3"></textarea>
                </div>

                <div class="form-group pb-2">
                    <label>Technologies</label><br>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input tech-checkbox" type="checkbox" value="Node Js">
                        <label class="form-check-label">Node Js</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input tech-checkbox" type="checkbox" value="Next Js">
                        <label class="form-check-label">Next Js</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input tech-checkbox" type="checkbox" value="React Js">
                        <label class="form-check-label">React Js</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input tech-checkbox" type="checkbox" value="TypeScript">
                        <label class="form-check-label">TypeScript</label>
                    </div>
                </div>

                <div class="form-group pb-2">
                    <label for="uploadImage">Upload Image</label>
                    <input type="file" class="form-control-file" id="uploadImage">
                </div>

                <div class="text-end pb-4">
                    <button type="button" class="btn btn-info" id="submitBtn">Submit</button>
                </div>

            </div>
        </div>

        <!-- PROJECT LIST -->
        <h2 class="text-center mt-4">MY PROJECT</h2>
        <div class="row" id="root"></div>

    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>


    <script>
        let projects = [];

        // DOM Elements
        const projectsContainer = document.getElementById("root");
        const submitBtn = document.getElementById("submitBtn");
        const uploadImage = document.getElementById("uploadImage");

        let selectedImage = "";

        // Render project cards
        function renderProjects() {
            projectsContainer.innerHTML = "";

            projects.forEach((project, index) => {
                const card = document.createElement("div");
                card.className = "col-12 col-md-4 mb-4";

                card.innerHTML = `
            <div class="card bg-dark border-light">
                <img src="${project.image
                    }" class="card-img-top" style="height:200px; object-fit:cover;">
                <div class="card-body text-light">
                    <h5 class="card-title">${project.name}</h5>
                    <p class="card-text small text-muted">
                        ${new Date(project.startDate).toLocaleDateString(
                        "id-ID"
                    )} -
                        ${new Date(project.endDate).toLocaleDateString("id-ID")}
                    </p>
                    <p class="card-text">${project.description}</p>
                    <p class="card-text small">Technologies: ${project.technologies.join(
                        ", "
                    )}</p>
                    <a href="#" class="btn btn-secondary btn-sm">Edit</a>
                    <a href="#" class="btn btn-danger btn-sm">Delete</a>
                </div>
            </div>
        `;

                projectsContainer.appendChild(card);
            });
        }
        renderProjects();

        // Handle image upload
        uploadImage.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedImage = URL.createObjectURL(file);
            }
        });

        // Submit form
        submitBtn.addEventListener("click", () => {
            const projectName = document.getElementById("projectName").value.trim();
            const startDate = document.getElementById("startDate").value;
            const endDate = document.getElementById("endDate").value;
            const description = document.getElementById("description").value.trim();
            const technologies = [
                ...document.querySelectorAll(".tech-checkbox:checked"),
            ].map((checkbox) => checkbox.value);

            // Validation
            if (!projectName || !startDate || !endDate || technologies.length === 0) {
                alert(
                    "Formnya diisi semua yaa, minimal harus ada nama project, tanggal mulai, tanggal selesai, dan teknologi yang digunakan lah Boss!"
                );
                return;
            }

            // Create object
            const newProjectObject = {
                name: projectName,
                startDate,
                endDate,
                description: description || "Tidak ada deskripsi",
                technologies,
                image: selectedImage || "https://via.placeholder.com/300x200",
            };

            console.log("Data Proyek Baru:", newProjectObject);
            alert("Project added succesfully!");

            projects.push(newProjectObject);
            renderProjects();

            // Reset form
            document.getElementById("projectName").value = "";
            document.getElementById("startDate").value = "";
            document.getElementById("endDate").value = "";
            document.getElementById("description").value = "";
            document
                .querySelectorAll(".tech-checkbox")
                .forEach((c) => (c.checked = false));
            uploadImage.value = "";
            selectedImage = "";
        });







    </script>
</body>

</html>
